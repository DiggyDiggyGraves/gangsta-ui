name: CI with Yarn Berry

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Yarn Berry
        uses: threeal/setup-yarn-action@v2.0.0
        with:
          version: stable

      - name: Install dependencies
        run: yarn install
